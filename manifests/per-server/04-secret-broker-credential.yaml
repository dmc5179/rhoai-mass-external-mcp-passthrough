# Static credential the broker uses ONLY for discovery (initialize/tools/list).
# User tools/call requests do not use it.
# Ref: RHCL 1.5 "Register MCP servers and create policies" section 2.4
apiVersion: v1
kind: Secret
metadata:
  name: ${MCP_SERVER_NAME}-broker-credential
  namespace: ${MCP_SERVER_NAMESPACE}   # same namespace as the MCPServerRegistration
  labels:
    mcp.kuadrant.io/secret: "true"     # REQUIRED - the controller ignores the Secret without it
type: Opaque
stringData:
  # Sent verbatim as the Authorization header, so include the scheme
  # (e.g. "Bearer <token>"). Use a long-lived service credential the external
  # server accepts, not a short-lived user token.
  token: "${BROKER_CREDENTIAL}"
